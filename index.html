<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guanghui Ren | 任广辉</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap');

  :root {
    --bg: #0a0e17;
    --bg-card: #111827;
    --bg-hover: #1a2332;
    --border: #1e293b;
    --text: #e2e8f0;
    --text-dim: #64748b;
    --text-bright: #f8fafc;
    --accent: #22d3ee;
    --accent2: #a78bfa;
    --accent3: #34d399;
    --accent4: #fb923c;
    --green: #4ade80;
    --red: #f87171;
    --yellow: #fbbf24;
    --pink: #f472b6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    line-height: 1.6;
    overflow-x: hidden;
  }

  .terminal-cursor {
    display: inline-block;
    width: 8px;
    height: 16px;
    background: var(--accent);
    animation: blink 1s step-end infinite;
    vertical-align: middle;
    margin-left: 4px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .grid-bg {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background-image:
      linear-gradient(rgba(34, 211, 238, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34, 211, 238, 0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none; z-index: 0;
  }

  .scanline {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    pointer-events: none; z-index: 1000;
  }

  .container {
    max-width: 900px; margin: 0 auto; padding: 40px 20px;
    position: relative; z-index: 1;
  }

  /* Loading */
  .loading-screen {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 60vh;
    font-family: 'JetBrains Mono', monospace; color: var(--accent);
  }
  .loading-screen .spinner {
    width: 40px; height: 40px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 1s linear infinite; margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* HEADER */
  .header {
    border: 1px solid var(--border); background: var(--bg-card);
    border-radius: 8px; overflow: hidden; margin-bottom: 24px;
  }
  .terminal-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px; background: #0d1117;
    border-bottom: 1px solid var(--border);
  }
  .terminal-dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot-red { background: var(--red); }
  .dot-yellow { background: var(--yellow); }
  .dot-green { background: var(--green); }
  .terminal-title {
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: var(--text-dim); margin-left: 8px;
  }

  .profile-section {
    display: flex; gap: 32px; padding: 32px; align-items: flex-start;
  }
  .avatar-container { flex-shrink: 0; position: relative; }
  .avatar {
    width: 140px; height: 140px; border-radius: 8px;
    border: 2px solid var(--border); object-fit: cover;
    filter: grayscale(30%); transition: filter 0.3s, border-color 0.3s;
  }
  .avatar:hover { filter: grayscale(0%); border-color: var(--accent); }
  .avatar-frame {
    position: absolute; top: -4px; left: -4px; right: -4px; bottom: -4px;
    border: 1px solid var(--accent); border-radius: 10px; opacity: 0.3;
  }

  .profile-info { flex: 1; }
  .prompt-line {
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
    color: var(--text-dim); margin-bottom: 4px;
  }
  .prompt-line .user { color: var(--accent); }
  .prompt-line .at { color: var(--text-dim); }
  .prompt-line .host { color: var(--accent2); }
  .prompt-line .path { color: var(--accent3); }
  .prompt-line .symbol { color: var(--text-dim); }

  .name {
    font-family: 'Space Grotesk', sans-serif; font-size: 32px;
    font-weight: 700; color: var(--text-bright); margin: 8px 0 4px;
    letter-spacing: -0.5px;
  }
  .name-cn { font-size: 18px; color: var(--text-dim); margin-bottom: 12px; }

  .bio-line {
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
    color: var(--text); margin-bottom: 3px;
  }
  .bio-line .key { color: var(--accent); }
  .bio-line .val { color: var(--accent3); }
  .bio-line .str { color: var(--yellow); }

  .links {
    display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap;
  }
  .link-btn {
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    padding: 6px 14px; border: 1px solid var(--border);
    border-radius: 4px; color: var(--text); text-decoration: none;
    background: transparent; transition: all 0.2s;
    display: flex; align-items: center; gap: 6px;
  }
  .link-btn:hover {
    border-color: var(--accent); color: var(--accent);
    background: rgba(34, 211, 238, 0.05);
  }

  /* SECTION */
  .section-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 16px; font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }
  .section-header .hash { color: var(--text-dim); }
  .section-header .title { color: var(--text-bright); font-weight: 600; }

  /* SECTION */
  .section {
    border: 1px solid var(--border); background: var(--bg-card);
    border-radius: 8px; padding: 24px; margin-bottom: 24px;
  }

  /* PUBLICATIONS */
  .pub-list { list-style: none; }
  .pub-item {
    padding: 16px 0; border-bottom: 1px solid var(--border); transition: background 0.2s;
  }
  .pub-item:last-child { border-bottom: none; }
  .pub-item:hover {
    background: var(--bg-hover); margin: 0 -12px;
    padding-left: 12px; padding-right: 12px; border-radius: 4px;
  }
  .pub-venue {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--accent); margin-bottom: 4px;
    display: flex; align-items: center; gap: 6px;
  }
  .pub-badge {
    font-size: 10px; padding: 1px 6px; border-radius: 3px; font-weight: 500;
  }
  .badge-award { background: rgba(251, 191, 36, 0.15); color: var(--yellow); border: 1px solid rgba(251, 191, 36, 0.3); }
  .badge-top { background: rgba(34, 211, 238, 0.15); color: var(--accent); border: 1px solid rgba(34, 211, 238, 0.3); }
  .pub-title {
    font-size: 15px; font-weight: 500; color: var(--text-bright);
    margin-bottom: 4px; line-height: 1.4;
  }
  .pub-title a { color: inherit; text-decoration: none; }
  .pub-title a:hover { color: var(--accent); }
  .pub-authors {
    font-size: 12px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace;
  }
  .pub-authors .me { color: var(--accent); font-weight: 500; }
  .pub-authors .corresponding { color: var(--accent); font-weight: 700; margin-left: 1px; cursor: help; }
  .pub-legend { font-size: 11px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; margin: 4px 0 10px; }
  .pub-filters {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
    margin: 0 0 16px; font-family: 'JetBrains Mono', monospace;
  }
  .filter-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .filter-label { font-size: 11px; color: var(--text-dim); }
  .filter-btn {
    font-family: inherit; font-size: 11px; color: var(--text-dim);
    background: transparent; border: 1px solid var(--border);
    padding: 3px 10px; border-radius: 4px; cursor: pointer;
    transition: all .15s ease;
  }
  .filter-btn:hover { color: var(--text); border-color: var(--accent); }
  .filter-btn.active { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .filter-select {
    font-family: inherit; font-size: 11px; color: var(--text);
    background: var(--bg-card); border: 1px solid var(--border);
    padding: 3px 8px; border-radius: 4px; cursor: pointer;
  }
  .filter-select:focus { outline: none; border-color: var(--accent); }
  .filter-count { font-size: 11px; color: var(--text-dim); margin-left: auto; }
  .pub-field {
    font-size: 10px; color: var(--accent2); border: 1px solid var(--accent2);
    border-radius: 3px; padding: 0 6px; margin-left: 8px; opacity: .8;
  }
  .pub-meta {
    display: flex; gap: 16px; margin-top: 6px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
  }
  .pub-meta .citations { color: var(--accent3); }
  .pub-meta .year { color: var(--text-dim); }

  /* STATUS */
  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--text-dim); padding: 12px 0; border-top: 1px solid var(--border);
  }
  .sync-status { display: flex; align-items: center; gap: 6px; }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; }
  .sync-dot.ok { background: var(--green); }
  .sync-dot.err { background: var(--red); }

  /* FOOTER */
  .footer {
    text-align: center; padding: 32px 0;
    font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-dim);
  }
  .footer .ascii { color: var(--accent); opacity: 0.3; }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    .profile-section { flex-direction: column; align-items: center; text-align: center; }
    .links { justify-content: center; }
    .name { font-size: 24px; }
    .bio-line { text-align: left; }
  }

  .fade-in {
    opacity: 0; transform: translateY(10px);
    animation: fadeIn 0.5s ease forwards;
  }
  @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

  .glow-text { text-shadow: 0 0 20px rgba(34, 211, 238, 0.3); }
</style>
</head>
<body>

<div class="grid-bg"></div>
<div class="scanline"></div>

<div class="container" id="app">
  <div class="loading-screen" id="loader">
    <div class="spinner"></div>
    <div>$ loading scholar profile...</div>
  </div>
</div>

<script>
const VENUE_KEYWORDS = {
  'cvpr': { short: 'CVPR', top: true },
  'iccv': { short: 'ICCV', top: true },
  'eccv': { short: 'ECCV', top: true },
  'neurips': { short: 'NeurIPS', top: true },
  'nips': { short: 'NeurIPS', top: true },
  'icml': { short: 'ICML', top: true },
  'iclr': { short: 'ICLR', top: true },
  'aaai': { short: 'AAAI', top: true },
  'ijcai': { short: 'IJCAI', top: true },
  'iros': { short: 'IROS' },
  'icra': { short: 'ICRA' },
  'rss': { short: 'RSS' },
  'tpami': { short: 'TPAMI', top: true },
  'tnnls': { short: 'TNNLS' },
  't-ro': { short: 'T-RO' },
  'tro': { short: 'T-RO' },
  'bmvc': { short: 'BMVC' },
  'acm mm': { short: 'ACM MM' },
};

const AWARD_KEYWORDS = ['best paper', 'best student', 'outstanding', 'honorable', 'best model'];

function highlightVenue(venue) {
  const v = venue.toLowerCase();
  for (const [key, info] of Object.entries(VENUE_KEYWORDS)) {
    if (v.includes(key)) return info;
  }
  return null;
}

function hasAward(venue) {
  const v = venue.toLowerCase();
  return AWARD_KEYWORDS.some(k => v.includes(k));
}

function highlightAuthors(authors) {
  // Strip a trailing "..." (Scholar truncation) to find the real last token.
  const core = authors.replace(/[,\s]*\.\.\.\s*$/, '');
  // Corresponding author = "Ren" appearing at the end of the (untruncated) list,
  // matching both the abbreviated "G Ren" and the full "Guanghui Ren".
  const isCorresponding = /\b(?:Guanghui|G\.?)\s*Ren\s*$/.test(core);

  let html = authors.replace(
    /\b(?:Guanghui|G\.?)\s*Ren\b/g,
    m => `<span class="me">${m}</span>`
  );

  if (isCorresponding) {
    // Add the corresponding-author marker to the final Ren occurrence.
    html = html.replace(
      /(<span class="me">[^<]*Ren<\/span>)(?![\s\S]*<span class="me">)/,
      '$1<sup class="corresponding" title="Corresponding author">&#8225;</sup>'
    );
  }
  return html;
}

function buildPubItem(paper) {
  const venue = highlightVenue(paper.venue);
  let badge = '';
  if (hasAward(paper.venue)) badge = '<span class="pub-badge badge-award">Award</span>';
  else if (venue && venue.top) badge = '<span class="pub-badge badge-top">Top Venue</span>';

  const venueLabel = venue ? venue.short : paper.venue;
  const titleHtml = paper.url
    ? `<a href="${paper.url}" target="_blank">${paper.title}</a>`
    : paper.title;

  return `
    <li class="pub-item" data-year="${paper.year || ''}" data-field="${paper.field || ''}">
      <div class="pub-venue">
        <span>${venueLabel}</span>${badge}${paper.field ? `<span class="pub-field">${paper.field}</span>` : ''}
      </div>
      <div class="pub-title">${titleHtml}</div>
      <div class="pub-authors">${highlightAuthors(paper.authors)}</div>
      <div class="pub-meta">
        <span class="citations">&uarr; ${paper.citations} citations</span>
        <span class="year">${paper.year || ''}</span>
      </div>
    </li>`;
}

function render(data) {
  const pubs = data.papers || [];

  const updatedDate = data.updated_at
    ? new Date(data.updated_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })
    : 'unknown';

  const app = document.getElementById('app');
  app.innerHTML = `
    <!-- HEADER -->
    <div class="header fade-in">
      <div class="terminal-bar">
        <div class="terminal-dot dot-red"></div>
        <div class="terminal-dot dot-yellow"></div>
        <div class="terminal-dot dot-green"></div>
        <span class="terminal-title">~/.profile/guanghui.ren — bash</span>
      </div>
      <div class="profile-section">
        <div class="avatar-container">
          <img class="avatar" src="avatar.jpg" alt="Guanghui Ren" onerror="this.onerror=null;this.src='https://scholar.googleusercontent.com/citations?view_op=medium_photo&user=oqN1dA8AAAAJ&citpid=11'">
          <div class="avatar-frame"></div>
        </div>
        <div class="profile-info">
          <div class="prompt-line">
            <span class="user">guest</span><span class="at">@</span><span class="host">homepage</span><span class="path"> ~/</span><span class="symbol"> $</span>
          </div>
          <h1 class="name glow-text">Guanghui Ren</h1>
          <p class="name-cn">任广辉</p>
          <div class="bio-line"><span class="key">role</span>=<span class="str">"Researcher &amp; Engineer"</span></div>
          <div class="bio-line"><span class="key">affiliation</span>=<span class="str">"AgiBot"</span></div>
          <div class="bio-line"><span class="key">interests</span>=[<span class="val">"Robotics"</span>, <span class="val">"Embodied AI"</span>, <span class="val">"Manipulation"</span>]</div>
          <div class="bio-line"><span class="key">email</span>=<span class="str">"renguanghui@agibot.com"</span></div>
          <div class="links">
            <a href="https://scholar.google.com/citations?user=oqN1dA8AAAAJ" class="link-btn" target="_blank"><span class="icon">📊</span> Scholar</a>
            <a href="https://github.com/sundrops" class="link-btn" target="_blank"><span class="icon">🐙</span> GitHub</a>
          </div>
        </div>
      </div>
    </div>

    <!-- PUBLICATIONS -->
    <div class="section fade-in">
      <div class="section-header">
        <span class="hash">#</span>
        <span class="title">Publications</span>
      </div>
      <div class="pub-legend"><span class="me">G. Ren</span><sup class="corresponding">&#8225;</sup> = corresponding author</div>
      <div class="pub-filters">
        <div class="filter-group" id="field-filters">
          <button class="filter-btn active" data-field="all">All</button>
          ${[...new Set(pubs.map(p => p.field).filter(Boolean))]
            .map(f => `<button class="filter-btn" data-field="${f}">${f}</button>`).join('')}
        </div>
        <div class="filter-group">
          <label class="filter-label">Year</label>
          <select id="year-filter" class="filter-select">
            <option value="all">All</option>
            ${[...new Set(pubs.map(p => p.year).filter(Boolean))]
              .sort((a, b) => b - a)
              .map(y => `<option value="${y}">${y}</option>`).join('')}
          </select>
        </div>
        <span class="filter-count" id="filter-count"></span>
      </div>
      <ul class="pub-list">
        ${pubs.map(buildPubItem).join('')}
      </ul>
    </div>

    <!-- STATUS -->
    <div class="status-bar fade-in">
      <div class="sync-status">
        <div class="sync-dot ok"></div>
        <span>Auto-synced from Google Scholar</span>
      </div>
      <span>Last updated: ${updatedDate}</span>
    </div>

    <!-- FOOTER -->
    <div class="footer fade-in">
      <div class="ascii">
╔══════════════════════════════════════════╗<br>
║  Built with &lt;code/&gt; &amp; GitHub Actions  ║<br>
╚══════════════════════════════════════════╝
      </div>
      <br>
      <span>${new Date().getFullYear()} &copy; Guanghui Ren</span>
      <span class="terminal-cursor"></span>
    </div>
  `;

  setupFilters();
}

function setupFilters() {
  const items = [...document.querySelectorAll('.pub-item')];
  const fieldBtns = [...document.querySelectorAll('#field-filters .filter-btn')];
  const yearSel = document.getElementById('year-filter');
  const countEl = document.getElementById('filter-count');
  if (!items.length || !yearSel) return;

  let activeField = 'all';

  function apply() {
    const year = yearSel.value;
    let shown = 0;
    items.forEach(li => {
      const okField = activeField === 'all' || li.dataset.field === activeField;
      const okYear = year === 'all' || li.dataset.year === year;
      const visible = okField && okYear;
      li.style.display = visible ? '' : 'none';
      if (visible) shown++;
    });
    countEl.textContent = `${shown} / ${items.length}`;
  }

  fieldBtns.forEach(btn => btn.addEventListener('click', () => {
    fieldBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeField = btn.dataset.field;
    apply();
  }));
  yearSel.addEventListener('change', apply);

  apply();
}

async function loadData() {
  try {
    const BASE = location.pathname.replace(/\/[^/]*$/, '/');
    const resp = await fetch(BASE + 'data.json?t=' + Date.now());
    if (!resp.ok) throw new Error('data.json not found');
    const data = await resp.json();
    render(data);
  } catch (e) {
    console.warn('Failed to load data.json, using fallback:', e);
    render(getFallbackData());
  }
}

function getFallbackData() {
  return {
    stats: { total_citations: 1345, h_index: 14, i10_index: 17 },
    updated_at: new Date().toISOString(),
    papers: [
      { title: "ACoT-VLA: Action Chain-of-Thought for Vision-Language-Action Models", authors: "L Zhong, Y Liu, Y Wei, Z Xiong, M Yao, S Liu, G Ren", venue: "CVPR 2026, 2026", citations: 20, year: 2026, field: "VLA", url: "https://scholar.google.com/citations?view_op=view_citation&hl=en&user=oqN1dA8AAAAJ&pagesize=100&citation_for_view=oqN1dA8AAAAJ:mvPsJ3kp5DgC" },
      { title: "Roboclaw: An agentic framework for scalable long-horizon robotic tasks", authors: "Ruiying Li, Yunlang Zhou, YuYao Zhu, Kylin Chen, Jingyuan Wang, Sukai Wang, Kongtao Hu, Minhui Yu, Bowen Jiang, Zhan Su, Jiayao Ma, Xin He, Yongjian Shen, Yang Yang, Guanghui Ren, Maoqing Yao, Wenhao Wang, Yao Mu", venue: "arXiv preprint arXiv:2603.11558, 2026", citations: 9, year: 2026, field: "Robot Learning", url: "https://scholar.google.com/citations?view_op=view_citation&hl=en&user=oqN1dA8AAAAJ&pagesize=100&citation_for_view=oqN1dA8AAAAJ:1qzjygNMrQYC" },
      { title: "AT-VLA: Adaptive Tactile Injection for Enhanced Feedback Reaction in Vision-Language-Action Models", authors: "X Li, M Cai, J Xu, J Zhu, H Fan, Y Shen, G Ren, H Dong", venue: "CVPR 2026, 2026", citations: 4, year: 2026, field: "VLA", url: "https://scholar.google.com/citations?view_op=view_citation&hl=en&user=oqN1dA8AAAAJ&pagesize=100&citation_for_view=oqN1dA8AAAAJ:olpn-zPbct0C" },
